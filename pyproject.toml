[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exifeye"
version = "1.0.0"
description = "IMAGE INTELLIGENCE | EXIF + GPS + DEVICE + FORENSICS - OSINT image metadata mining tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ExifEye" }]
keywords = ["osint", "exif", "gps", "metadata", "forensics", "image"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "exifread>=3.0.0",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
    "rich-pixels>=3.0.0",
    "click>=8.1.0",
    "imagehash>=4.3.0",
    "numpy>=1.24.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
exifeye = "exifeye:main"

[tool.setuptools]
py-modules = ["exifeye"]
packages = ["extractor", "output", "analyzers"]

[tool.setuptools.package-data]
extractor = ["device_db.json"]
output = ["banner.png"]